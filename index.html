<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4f8">
  <title>つながるケア</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Yu Gothic", sans-serif;
      background: #fff8fb;
      color: #333;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 45px 18px 60px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin: 15px 0 5px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .message {
      background: white;
      border-radius: 24px;
      padding: 25px 15px;
      font-size: 23px;
      line-height: 1.8;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,.05);
    }

    button {
      width: 100%;
      min-height: 88px;
      margin: 9px 0;
      border: none;
      border-radius: 24px;
      background: white;
      color: #078cf0;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    button:active {
      transform: scale(.98);
    }

    .voice {
      background: #ffdce9;
      margin-bottom: 14px;
    }

    #screen {
      display: none;
      background: white;
      border-radius: 24px;
      padding: 28px 18px;
      margin-top: 22px;
      font-size: 22px;
      line-height: 1.7;
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }

    #screen strong {
      display: block;
      color: #078cf0;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .back {
      background: #ffdce9;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<main>

  <h1>🌸 つながるケア 🌸</h1>

  <div class="subtitle">
    あなたの暮らしを支えるアプリ
  </div>

  <div class="message">
    大丈夫。<br>
    必要なところを押してください。
  </div>

  <button class="voice" onclick="speakText()">
    🔊 読み上げる
  </button>

  <div id="menu">

    <button onclick="openScreen('🏠 生活','毎日の暮らしについて確認できます。')">
      🏠 生活
    </button>

    <button onclick="openScreen('💊 通院・薬','通院やお薬について確認できます。')">
      💊 通院・薬
    </button>

    <button onclick="openScreen('💬 相談','困ったことや相談したいことを確認できます。')">
      💬 相談
    </button>

    <button onclick="openScreen('📅 予定','これからの予定を確認できます。')">
      📅 予定
    </button>

    <button onclick="openScreen('🆘 支援中断','支援が途切れそうなときに使います。')">
      🆘 支援中断
    </button>

  </div>

  <div id="screen"></div>

</main>

<script>
  function openScreen(title, text) {
    const menu = document.getElementById("menu");
    const screen = document.getElementById("screen");

    menu.style.display = "none";
    screen.style.display = "block";

    screen.innerHTML =
      "<strong>" + title + "</strong>" +
      "<div>" + text + "</div>" +
      "<button class='back' onclick='goBack()'>← 戻る</button>";
  }

  function goBack() {
    document.getElementById("screen").style.display = "none";
    document.getElementById("menu").style.display = "block";
  }

  function speakText() {
    const text =
      "つながるケアです。生活、通院と薬、相談、予定、支援中断から選んでください。";

    speechSynthesis.cancel();

    const voice =
      new SpeechSynthesisUtterance(text);

    voice.lang = "ja-JP";
    voice.rate = 0.85;

    speechSynthesis.speak(voice);
  }
</script>

</body>
</html>
